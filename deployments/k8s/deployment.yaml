apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-agent
  labels:
    app: code-agent
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: code-agent
  template:
    metadata:
      labels:
        app: code-agent
        version: v1
    spec:
      serviceAccountName: code-agent
      containers:
        - name: code-agent
          image: code-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CODE_AGENT_LLM_PRIMARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: code-agent-secrets
                  key: openai-api-key
            - name: CODE_AGENT_REDIS_ADDR
              value: "redis-cluster:6379"
            - name: CODE_AGENT_QDRANT_ADDR
              value: "qdrant:6334"
            - name: CODE_AGENT_TEMPORAL_HOST
              value: "temporal:7233"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/code-agent/configs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: code-agent-config
---
apiVersion: v1
kind: Service
metadata:
  name: code-agent
  labels:
    app: code-agent
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: code-agent
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: code-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: code-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-agent
---
apiVersion: v1
kind: Secret
metadata:
  name: code-agent-secrets
type: Opaque
stringData:
  openai-api-key: "your-api-key-here"
