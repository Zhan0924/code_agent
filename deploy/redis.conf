# Redis configuration for all-in-one container
bind 127.0.0.1
port 6379
# No password needed - only accessible within container
protected-mode yes

# Persistence
appendonly yes
appendfilename "appendonly.aof"
dir /var/lib/redis

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Performance
tcp-backlog 128
timeout 0
tcp-keepalive 300
