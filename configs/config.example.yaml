# ============================================================
# Code Agent Configuration
# ============================================================

server:
  http_addr: ":8080"
  ws_addr: ":8081"
  read_timeout: 30s
  write_timeout: 600s    # ⬆ 60s→600s: ReAct loop may take multiple LLM calls, each up to 5min
  shutdown_timeout: 30s   # ⬆ 15s→30s: allow in-flight long tasks to drain

llm:
  primary:
    provider: "anthropic"
    api_key: "${CODE_AGENT_LLM_PRIMARY_API_KEY}"  # Set via environment variable
    model: "claude-opus-4-7"
    base_url: "https://api.anthropic.com"  # Or your proxy URL
    max_tokens: 16384     # ⬆ 4096→16384: Opus supports 32K output; 16K per-step for long code gen
    temperature: 0.1
    timeout: 300s          # ⬆ 60s→300s: 16K tokens at ~40tok/s ≈ 400s; 300s with streaming safety margin
  fallback:
    provider: "ollama"
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5-coder:7b"
    max_tokens: 2048
    temperature: 0.1
    timeout: 120s
  circuit_breaker:
    max_failures: 5
    timeout: 30s
    half_open_max_requests: 2
  # Optional intent-based model tier router. When any of heavy/medium/light
  # model is non-empty, the orchestrator picks a tier per request based on
  # intent + a lightweight complexity heuristic (see internal/llm/router.go).
  # Leave all empty (default) to disable: every call goes through the
  # primary/fallback model unchanged.
  router:
    heavy_model: ""           # e.g. "claude-opus-4-7" — complex reasoning, multi-file edits, deploy/diagnose
    medium_model: ""          # e.g. "claude-sonnet-4-6" — single-file edits, code Q&A
    light_model: ""           # e.g. "claude-haiku-4-5" — intent parsing, summaries, simple chat
    heavy_max_tokens: 16384
    medium_max_tokens: 8192
    light_max_tokens: 4096

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 5

postgres:
  dsn: "postgres://agent:your_password@localhost:5432/code_agent?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

qdrant:
  addr: "localhost:6334"
  collection: "code_embeddings"
  vector_size: 1024
  timeout: 10s

temporal:
  host: "localhost:7233"
  namespace: "code-agent"
  task_queue: "agent-tasks"
  workflow_timeout: 30m
  activity_timeout: 5m

sandbox:
  docker_host: "unix:///run/podman/podman.sock"
  default_image: "python:3.12-slim"
  images:
    python: "python:3.12-slim"
    go: "golang:1.23-alpine"
    node: "node:22-alpine"
    bash: "alpine:3.20"
  memory_limit: "512m"
  cpu_limit: "1.0"
  timeout: 120s
  network_mode: "none"
  workspace_dir: "/workspace"

# host workspace 上 run_workspace_cmd 的执行行为(与 sandbox: 区别——后者是
# Docker 容器内,这里是 host 直接 exec 在 /tmp/agent-workspaces/<id>)。
# cmd_timeout 是单次 exec 的硬上限;LLM 可通过 tool args.timeout_seconds 在
# [0, cmd_timeout] 内提出更短上限,超此值被钳制。0 / 缺省按代码 5min 兜底。
workspace:
  cmd_timeout: 5m

mcp:
  servers: []
  # Example:
  # - name: "github"
  #   transport: "stdio"
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-github"]
  #   env:
  #     GITHUB_TOKEN: "${GITHUB_TOKEN}"

rag:
  chunk_max_tokens: 512
  overlap_tokens: 64
  embedding_model: "text-embedding-v3"
  embedding_dimension: 1024

  # Embedding API — requires OpenAI-compatible endpoint (separate from LLM provider).
  # Override via env: CODE_AGENT_RAG_EMBEDDING_BASE_URL / CODE_AGENT_RAG_EMBEDDING_API_KEY
  embedding_base_url: "${CODE_AGENT_RAG_EMBEDDING_BASE_URL}"
  embedding_api_key: "${CODE_AGENT_RAG_EMBEDDING_API_KEY}"

  # Reranking — disabled by default. Enable when cross-encoder model is available.
  rerank_enabled: false
  rerank_model: ""
  rerank_base_url: ""
  rerank_api_key: ""
  top_k: 10
  rerank_top_n: 3

  # File watcher — watches for source file changes and triggers incremental RAG re-indexing.
  # Requires ragEngine to be available. Debounces batch changes (2s window).
  watch_enabled: false
  watch_path: "."       # Path to watch; relative paths resolved from CWD

session:
  max_history_tokens: 32000       # ⬆ 4K→32K: Opus has 200K context; keep rich multi-turn history
  summary_threshold_tokens: 28000  # ⬆ 3.5K→28K: only summarize when truly approaching budget
  ttl: 24h
  compaction_mode: "truncate"     # "truncate" or "summarize"

memory:
  distill:
    enabled: true
    interval: 1h
    max_episodic_per_run: 50
    min_episodic_to_trigger: 3
    auto_discover: true
    max_tenants_per_tick: 32

security:
  sensitive_patterns:
    - "DROP\\s+DATABASE"
    - "DROP\\s+TABLE"
    - "DELETE\\s+FROM\\s+\\w+\\s*$"
    - "kubectl\\s+delete"
    - "kubectl\\s+apply"
    - "rm\\s+-rf\\s+/"
    - "TRUNCATE"
  require_approval_commands:
    - "kubectl apply"
    - "docker push"
    - "terraform apply"

logging:
  level: "info"
  format: "json"
  output: "stdout"

# ─── Authentication ─────────────────────────────────────────
auth:
  enabled: false  # Set to true in production
  jwt_secret: "${CODE_AGENT_AUTH_JWT_SECRET}"  # MUST set via env var
  jwt_issuer: "code-agent"
  token_expiry: "24h"
  refresh_expiry: "168h"

# ─── Distributed Tracing ────────────────────────────────────
tracing:
  enabled: true
  endpoint: "localhost:4317"
  service_name: "code-agent"
  sample_rate: 0.1
  insecure: true

# ─── Tree-sitter AST Parser (P1) ────────────────────────────
tree_sitter:
  enabled: false  # Requires CGO + tree-sitter build tag
  languages: ["go", "python", "typescript", "javascript", "rust", "java", "c", "cpp"]
  max_file_size: 1048576  # 1MB, skip files larger than this

# ─── Persistent PTY Sessions (P1) ───────────────────────────
pty:
  enabled: false
  backend: "local"            # "local" or "docker"
  image: "code-agent-sandbox:latest"  # Docker backend only
  max_sessions_per_workspace: 3
  idle_timeout: 5m
  command_timeout: 120s
  memory_limit: 536870912    # 512MB (Docker backend only)
  cpu_quota: 100000          # 1 core (Docker backend only)
  output_limit: 1048576      # 1MB max output per command
  shell: "/bin/bash"

# ─── LSP Integration (P1) ───────────────────────────────────
lsp:
  enabled: false
  max_concurrent_requests: 8
  servers:
    go:
      command: "gopls"
      args: ["serve"]
      languages: ["go"]
    python:
      command: "pylsp"
      args: []
      languages: ["python"]
    typescript:
      command: "typescript-language-server"
      args: ["--stdio"]
      languages: ["typescript", "javascript"]
    rust:
      command: "rust-analyzer"
      args: []
      languages: ["rust"]

# ─── Long-term Memory System (HybridStore) ──────────────────
memory:
  hot_ttl: 24h
  hot_scan_limit: 200
  conflict_threshold: 0.85
  conflict_margin: 0.2
  preserve_high_score: true
  max_conflicts_to_dedup: 32
  duplicate_threshold: 0.7
  max_per_run: 10
  dedup_candidate_limit: 30
  embedding_dim: 1536
  promote:
    enabled: true
    threshold: 0.7
    batch_size: 50
    flush_interval: 5s
    queue_size: 256
  demote:
    enabled: true
    threshold: 0.3
  access:
    enabled: true
    batch_size: 100
    flush_interval: 5s
    queue_size: 1024
  decay:
    enabled: true
    interval: 24h
    older_than: 720h # 30 days
    factor: 0.95
  distill:
    enabled: false
    interval: 6h
    max_episodic_per_run: 50
    min_episodic_to_trigger: 3
    auto_discover: true
    max_tenants_per_tick: 32
    min_episodic_for_discovery: 0
    targets: []
